<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rising bar chart with an upward arrow and an eligibility match badge">
  <defs>
    <linearGradient id="g4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8fbf5"/>
      <stop offset="100%" stop-color="#d3f3ea"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0e8a70"/>
      <stop offset="100%" stop-color="#6fe0c4"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="225" r="200" fill="url(#g4bg)"/>
  <ellipse cx="300" cy="392" rx="180" ry="18" fill="#0d2b2f" opacity="0.08"/>

  <!-- baseline -->
  <rect x="110" y="330" width="380" height="6" rx="3" fill="#0d2b2f" opacity="0.15"/>

  <!-- bars -->
  <rect x="140" y="270" width="46" height="60" rx="8" fill="url(#barG)"/>
  <rect x="210" y="235" width="46" height="95" rx="8" fill="url(#barG)"/>
  <rect x="280" y="190" width="46" height="140" rx="8" fill="url(#barG)"/>
  <rect x="350" y="150" width="46" height="180" rx="8" fill="#e8823c"/>

  <!-- trend arrow -->
  <path d="M150 260 L225 210 L295 170 L375 120" stroke="#0d2b2f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M355 108 L380 118 L372 144" stroke="#0d2b2f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- badge -->
  <circle cx="470" cy="110" r="46" fill="#ffffff" stroke="#14b391" stroke-width="5"/>
  <text x="470" y="103" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#0e8a70" text-anchor="middle">92%</text>
  <text x="470" y="124" font-family="Poppins, sans-serif" font-size="11" fill="#5c716f" text-anchor="middle">eligible</text>

  <!-- magnifier -->
  <circle cx="120" cy="150" r="24" fill="none" stroke="#0d2b2f" stroke-width="7"/>
  <line x1="137" y1="167" x2="158" y2="188" stroke="#0d2b2f" stroke-width="8" stroke-linecap="round"/>

  <!-- sparkles -->
  <circle cx="520" cy="230" r="6" fill="#14b391"/>
  <circle cx="90" cy="260" r="5" fill="#e8823c"/>
</svg>
