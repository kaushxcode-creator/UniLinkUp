<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Friendly AI assistant robot with a typing chat bubble">
  <defs>
    <linearGradient id="g5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8fbf5"/>
      <stop offset="100%" stop-color="#d3f3ea"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="225" r="200" fill="url(#g5bg)"/>
  <ellipse cx="300" cy="392" rx="150" ry="18" fill="#0d2b2f" opacity="0.08"/>

  <!-- antenna -->
  <line x1="300" y1="118" x2="300" y2="90" stroke="#0d2b2f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="82" r="10" fill="#e8823c"/>

  <!-- head -->
  <rect x="210" y="118" width="180" height="150" rx="40" fill="#0d2b2f"/>
  <rect x="234" y="150" width="132" height="80" rx="24" fill="#eafaf5"/>
  <circle cx="272" cy="190" r="14" fill="#14b391"/>
  <circle cx="328" cy="190" r="14" fill="#14b391"/>
  <path d="M285 210 Q300 220 315 210" stroke="#0e8a70" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ears -->
  <rect x="192" y="168" width="18" height="40" rx="8" fill="#123a3f"/>
  <rect x="390" y="168" width="18" height="40" rx="8" fill="#123a3f"/>

  <!-- body -->
  <rect x="235" y="268" width="130" height="90" rx="24" fill="#14b391"/>
  <circle cx="300" cy="313" r="20" fill="#0e8a70"/>
  <path d="M292 313 l6 6 12 -14" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chat bubble with typing dots -->
  <g>
    <rect x="380" y="140" width="140" height="66" rx="18" fill="#ffffff" stroke="#e8823c" stroke-width="3"/>
    <path d="M400 206 L390 226 L420 206 Z" fill="#ffffff" stroke="#e8823c" stroke-width="3"/>
    <circle cx="425" cy="173" r="7" fill="#e8823c"/>
    <circle cx="450" cy="173" r="7" fill="#e8823c" opacity="0.7"/>
    <circle cx="475" cy="173" r="7" fill="#e8823c" opacity="0.4"/>
  </g>

  <!-- sparkles -->
  <circle cx="120" cy="140" r="6" fill="#14b391"/>
  <circle cx="100" cy="280" r="5" fill="#e8823c"/>
  <rect x="470" y="270" width="12" height="12" rx="3" fill="#6fe0c4" transform="rotate(20 476 276)"/>
</svg>
