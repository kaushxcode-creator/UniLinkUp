<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recruiter and candidate shaking hands across a table with a resume and briefcase">
  <defs>
    <linearGradient id="g3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8fbf5"/>
      <stop offset="100%" stop-color="#d3f3ea"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="225" r="200" fill="url(#g3bg)"/>
  <ellipse cx="300" cy="392" rx="180" ry="18" fill="#0d2b2f" opacity="0.08"/>

  <!-- table -->
  <path d="M120 330 L480 330 L450 360 L150 360 Z" fill="#0e8a70"/>
  <rect x="150" y="360" width="20" height="35" fill="#0d2b2f"/>
  <rect x="430" y="360" width="20" height="35" fill="#0d2b2f"/>

  <!-- resume paper -->
  <rect x="255" y="300" width="60" height="40" rx="4" fill="#ffffff" stroke="#e1ece9" stroke-width="2"/>
  <rect x="263" y="308" width="34" height="4" rx="2" fill="#14b391"/>
  <rect x="263" y="317" width="44" height="3" rx="1.5" fill="#cfe6e2"/>
  <rect x="263" y="324" width="44" height="3" rx="1.5" fill="#cfe6e2"/>

  <!-- briefcase -->
  <rect x="150" y="290" width="46" height="34" rx="6" fill="#0d2b2f"/>
  <rect x="164" y="278" width="18" height="14" rx="4" fill="none" stroke="#0d2b2f" stroke-width="5"/>
  <rect x="150" y="303" width="46" height="6" fill="#e8823c"/>

  <!-- left figure (recruiter) -->
  <g>
    <path d="M110 330 C110 275 130 252 175 252 C220 252 240 275 240 330 Z" fill="#0d2b2f"/>
    <circle cx="175" cy="216" r="36" fill="#f2c29b"/>
    <path d="M139 210 C139 186 211 186 211 210 L211 216 C211 196 139 196 139 216 Z" fill="#123a3f"/>
    <!-- arm to handshake -->
    <path d="M230 300 Q 270 300 300 320" stroke="#f2c29b" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <!-- right figure (candidate) -->
  <g>
    <path d="M360 330 C360 275 380 252 425 252 C470 252 490 275 490 330 Z" fill="#14b391"/>
    <circle cx="425" cy="216" r="36" fill="#a9704a"/>
    <path d="M395 202 Q425 178 455 202 Q455 190 425 188 Q395 190 395 202 Z" fill="#0d2b2f"/>
    <!-- arm to handshake -->
    <path d="M370 300 Q 335 300 300 320" stroke="#a9704a" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <!-- handshake knot -->
  <circle cx="300" cy="320" r="14" fill="#e8823c"/>

  <!-- sparkles -->
  <circle cx="500" cy="130" r="6" fill="#14b391"/>
  <circle cx="90" cy="150" r="5" fill="#e8823c"/>
  <rect x="480" y="200" width="10" height="10" rx="2" fill="#6fe0c4" transform="rotate(30 485 205)"/>
</svg>
