<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two people collaborating at a desk with a laptop and a match-percentage chat bubble">
  <defs>
    <linearGradient id="g2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8fbf5"/>
      <stop offset="100%" stop-color="#d3f3ea"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="225" r="200" fill="url(#g2bg)"/>
  <ellipse cx="300" cy="392" rx="180" ry="18" fill="#0d2b2f" opacity="0.08"/>

  <!-- desk -->
  <rect x="90" y="300" width="420" height="18" rx="6" fill="#0e8a70"/>
  <rect x="120" y="318" width="18" height="55" fill="#0d2b2f"/>
  <rect x="462" y="318" width="18" height="55" fill="#0d2b2f"/>

  <!-- laptop on desk -->
  <rect x="255" y="255" width="90" height="60" rx="6" fill="#0d2b2f"/>
  <rect x="263" y="262" width="74" height="46" rx="3" fill="#ffffff"/>
  <rect x="240" y="298" width="120" height="10" rx="4" fill="#123a3f"/>
  <rect x="278" y="278" width="44" height="8" rx="2" fill="#6fe0c4"/>
  <rect x="278" y="290" width="30" height="6" rx="2" fill="#e8823c"/>

  <!-- left person -->
  <g>
    <path d="M100 300 C100 250 118 230 160 230 C202 230 220 250 220 300 Z" fill="#14b391"/>
    <circle cx="160" cy="196" r="34" fill="#f2c29b"/>
    <path d="M126 190 C126 160 194 160 194 190 C194 172 126 172 126 190 Z" fill="#123a3f"/>
  </g>

  <!-- right person -->
  <g>
    <path d="M380 300 C380 250 398 230 440 230 C482 230 500 250 500 300 Z" fill="#e8823c"/>
    <circle cx="440" cy="196" r="34" fill="#a9704a"/>
    <path d="M406 186 C406 158 474 158 474 186 L474 196 C474 178 406 178 406 196 Z" fill="#0d2b2f"/>
  </g>

  <!-- match chat bubble -->
  <g>
    <rect x="380" y="70" width="150" height="80" rx="18" fill="#ffffff" stroke="#14b391" stroke-width="3"/>
    <path d="M420 150 L405 172 L440 150 Z" fill="#ffffff" stroke="#14b391" stroke-width="3"/>
    <text x="455" y="120" font-family="Poppins, sans-serif" font-size="30" font-weight="700" fill="#0e8a70" text-anchor="middle">92%</text>
    <text x="455" y="138" font-family="Poppins, sans-serif" font-size="12" fill="#5c716f" text-anchor="middle">match</text>
  </g>

  <!-- floating icons -->
  <circle cx="80" cy="120" r="6" fill="#e8823c"/>
  <circle cx="520" cy="230" r="7" fill="#14b391"/>
  <rect x="60" y="230" width="12" height="12" rx="3" fill="#6fe0c4" transform="rotate(15 66 236)"/>
</svg>
