  <rect x="120" y="120" width="130" height="18" rx="8" fill="#123a3f"/>
  <g fill="#6fe0c4">
    <rect x="138" y="152" width="22" height="18" rx="3"/><rect x="174" y="152" width="22" height="18" rx="3" opacity=".55"/><rect x="210" y="152" width="22" height="18" rx="3"/>
    <rect x="138" y="186" width="22" height="18" rx="3" opacity=".55"/><rect x="174" y="186" width="22" height="18" rx="3"/><rect x="210" y="186" width="22" height="18" rx="3"/>
    <rect x="138" y="220" width="22" height="18" rx="3"/><rect x="174" y="220" width="22" height="18" rx="3"/><rect x="210" y="220" width="22" height="18" rx="3" opacity=".55"/>
    <rect x="138" y="254" width="22" height="18" rx="3" opacity=".55"/><rect x="174" y="254" width="22" height="18" rx="3"/><rect x="210" y="254" width="22" height="18" rx="3"/>
    <rect x="138" y="288" width="22" height="18" rx="3"/><rect x="174" y="288" width="22" height="18" rx="3" opacity=".55"/><rect x="210" y="288" width="22" height="18" rx="3"/>
