    <circle cx="322" cy="355" r="11" fill="#a9704a"/>
    <rect x="342" y="348" width="80" height="6" rx="3" fill="#0d2b2f"/>
    <rect x="342" y="359" width="54" height="5" rx="2.5" fill="#cfe6e2"/>
    <circle cx="468" cy="355" r="11" fill="#e8823c"/>
