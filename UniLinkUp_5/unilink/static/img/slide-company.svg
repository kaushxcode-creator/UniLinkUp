  <rect x="310" y="152" width="150" height="7" rx="3.5" fill="#cfe6e2"/>
  <rect x="310" y="166" width="130" height="7" rx="3.5" fill="#cfe6e2"/>
  <rect x="310" y="190" width="58" height="22" rx="11" fill="#e8fbf5" stroke="#14b391" stroke-width="2"/>
  <rect x="376" y="190" width="58" height="22" rx="11" fill="#fff3e8" stroke="#e8823c" stroke-width="2"/>
