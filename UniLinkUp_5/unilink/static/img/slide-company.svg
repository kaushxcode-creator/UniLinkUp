    <rect x="300" y="285" width="190" height="40" rx="10" fill="#ffffff" stroke="#e1ece9" stroke-width="2"/>
    <circle cx="322" cy="305" r="11" fill="#f2c29b"/>
    <rect x="342" y="298" width="80" height="6" rx="3" fill="#0d2b2f"/>
    <rect x="342" y="309" width="54" height="5" rx="2.5" fill="#cfe6e2"/>
