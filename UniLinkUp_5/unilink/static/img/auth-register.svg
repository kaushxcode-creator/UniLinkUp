<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Person completing a profile checklist, representing registration">
  <circle cx="250" cy="200" r="190" fill="#ffffff" opacity="0.06"/>
  <circle cx="250" cy="200" r="140" fill="#ffffff" opacity="0.05"/>

  <!-- profile card -->
  <rect x="150" y="95" width="200" height="230" rx="20" fill="#123a3f" stroke="#6fe0c4" stroke-width="4"/>
  <circle cx="250" cy="160" r="34" fill="#e8823c"/>
  <path d="M250 160 m-14,18 a14 18 0 0 1 28 0" fill="none" stroke="#123a3f" stroke-width="0"/>
  <rect x="195" y="212" width="110" height="10" rx="5" fill="#6fe0c4"/>
  <rect x="195" y="232" width="80" height="8" rx="4" fill="#ffffff" opacity="0.5"/>

  <!-- checklist rows -->
  <g fill="none" stroke="#14b391" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="185" y="258" width="18" height="18" rx="4" fill="#14b391" stroke="none"/>
    <path d="M189 267 l4 4 8 -8" stroke="#0d2b2f"/>
  </g>
  <rect x="212" y="262" width="90" height="8" rx="4" fill="#ffffff" opacity="0.6"/>

  <g fill="none" stroke="#14b391" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="185" y="286" width="18" height="18" rx="4" fill="#14b391" stroke="none"/>
    <path d="M189 295 l4 4 8 -8" stroke="#0d2b2f"/>
  </g>
  <rect x="212" y="290" width="70" height="8" rx="4" fill="#ffffff" opacity="0.6"/>

  <!-- floating plus / sparkle -->
  <circle cx="380" cy="130" r="26" fill="#e8823c"/>
  <rect x="372" y="122" width="16" height="4" rx="2" fill="#123a3f"/>
  <rect x="378" y="116" width="4" height="16" rx="2" fill="#123a3f"/>

  <circle cx="110" cy="330" r="6" fill="#6fe0c4"/>
  <circle cx="95" cy="150" r="5" fill="#14b391"/>
  <circle cx="380" cy="300" r="7" fill="#6fe0c4"/>
</svg>
