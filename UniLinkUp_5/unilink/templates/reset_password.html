{% extends 'base.html' %}
{% block title %}Reset Password — UniLinkUp{% endblock %}
{% block content %}

<div class="sb-auth-wrap sb-animate-up">
  <div class="sb-auth-panel">
    <img src="{{ url_for('static', filename='img/auth-register.svg') }}" alt="New password illustration">
    <h3>Identity verified</h3>
    <p>Choose a new password for your {{ 'student' if role == 'student' else 'placement officer' }} account.</p>
  </div>
  <div class="sb-auth-form-side">
    <h3 class="mb-1">Set a New Password</h3>
    <p class="text-muted small mb-4">Use at least 6 characters.</p>
    <form method="POST" data-loading="Updating...">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" required minlength="6" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="6">
      </div>
      <button type="submit" class="btn sb-btn-primary w-100">
        <i class="bi bi-check-circle-fill"></i> Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
